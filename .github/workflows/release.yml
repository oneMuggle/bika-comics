name: Create GitHub Release

on:
  workflow_run:
    workflows: [Build Android APK]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Wait for artifact availability
        # GitHub Actions 在 workflow_run 场景下, artifacts 有最终一致性延迟
        # 60s 是社区推荐的稳妥值
        run: sleep 60
        shell: bash

      - name: Download Release APK via gh CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # 第五十八批（2026-10-29）：修复 `gh run download --run-id` 非法标志。
        # 实际用法为 `gh run download [<run-id>]`，run-id 是【位置参数】而非标志，
        # 传 `--run-id` 会直接报 "unknown flag: --run-id" 并 exit 1。
        # 该 bug 自 workflow 编写起一直存在，此前因上游 build job 从未成功，
        # 本 job 始终被 skipped，故从未暴露；build 转绿后立即显现。
        # 另外 --repo 仅在跨仓库时需要，同仓库下载可省略，故这里不再传 --repo。
        run: |
          gh run download \
            "${{ github.event.workflow_run.id }}" \
            --name "picacg-release-apk" \
            --dir .
          ls -la
          ls -la app-release.apk 2>/dev/null || find . -name "*.apk" -ls

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          files: app-release.apk
          body: |
            ## 哔咔漫画 Android 构建产物

            **构建时间**: ${{ github.ref_name }} @ ${{ github.event.workflow_run.event.head_commit.timestamp }}

            ---
            *由 GitHub Actions 自动构建发布*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}